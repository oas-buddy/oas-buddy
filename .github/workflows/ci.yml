name: CI

on:
  push:
    branches: [master]
  pull_request:

# Only ever reads the repository: checkout, then a Maven build. Declared explicitly rather than
# relying on the repository default, which is a setting that can change out from under the workflow.
# pull-requests: read lets the Sonar scanner read the pull request it is analysing.
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # A fork's pull request gets no secrets, so this is empty there and Sonar is skipped.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs the full history to attribute new code; a shallow clone makes it warn.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Xvfb (for JavaFX/TestFX tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # verify rather than test: it also writes the JaCoCo coverage report Sonar reads.
      #
      # -U is load-bearing, not habit. When a download fails transiently, the resolver records the
      # artifact as absent in ~/.m2 and will not look again; setup-java's maven cache then saves
      # that record and restores it on every later run, whose key is a hash of the POMs and so does
      # not change until a POM does. The build then fails identically every time with
      # "Could not find artifact ... (absent)" for an artifact that is sitting in Central. -U
      # forces a re-check for missing releases, which is what breaks that loop. There are no
      # snapshot dependencies here, so it costs nothing else.
      - name: Build and test
        if: env.SONAR_TOKEN == ''
        run: xvfb-run -a mvn -B -U verify

      - name: Build, test and analyse with SonarCloud
        if: env.SONAR_TOKEN != ''
        run: xvfb-run -a mvn -B -U verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
