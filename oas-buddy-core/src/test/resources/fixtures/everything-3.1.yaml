openapi: 3.1.0
info:
  title: Everything 3.1
  summary: Uses what 3.0 lacks
  version: 1.0.0
  license:
    name: Apache 2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
paths:
  /pets:
    get:
      parameters:
        - name: limit
          in: query
          schema:
            type:
              - integer
              - 'null'
            exclusiveMinimum: 0
            maximum: 100
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
webhooks:
  newPet:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type:
                - string
                - 'null'
      responses:
        '200':
          description: ok
components:
  schemas:
    Pet:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        kind:
          const: dog
          examples:
            - dog
        id:
          type:
            - integer
            - string
        nothing:
          type:
            - 'null'
        plain:
          type:
            - string
        size:
          type: number
          minimum: 1
          exclusiveMinimum: 0
          exclusiveMaximum: 10
  pathItems:
    Shared:
      get:
        responses:
          '200':
            description: ok
  securitySchemes:
    ApiKey:
      type: apiKey
      name: X-API-Key
      in: header
    Mutual:
      type: mutualTLS
