openapi: 3.1.0
info:
  title: Nullable and bounds
  version: 1.0.0
paths:
  /pets:
    get:
      parameters:
      - name: limit
        in: query
        schema:
          type:
          - integer
          - "null"
          minimum: 1
          exclusiveMaximum: 100
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
              example:
                nullable: true
                exclusiveMinimum: true
      callbacks:
        onEvent:
          '{$request.query.url}':
            post:
              requestBody:
                content:
                  application/json:
                    schema:
                      type:
                      - string
                      - "null"
              responses:
                "200":
                  description: ok
components:
  schemas:
    Pet:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          exclusiveMinimum: 0
        tag:
          type:
          - string
          - "null"
          default: null
        nullable:
          type: boolean
          description: a property that happens to be named nullable
        weight:
          type: number
          x-oas-buddy-exclusiveMaximum: true
        owner:
          x-oas-buddy-nullable: true
          allOf:
          - $ref: '#/components/schemas/Owner'
    Owner:
      type: object
