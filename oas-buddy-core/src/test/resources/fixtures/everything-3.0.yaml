openapi: 3.0.3
info:
  title: Everything 3.1
  x-oas-buddy-summary: Uses what 3.0 lacks
  version: 1.0.0
  license:
    name: Apache 2.0
    x-oas-buddy-identifier: Apache-2.0
x-oas-buddy-jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
paths:
  /pets:
    get:
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            nullable: true
            minimum: 0
            exclusiveMinimum: true
            maximum: 100
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
x-oas-buddy-webhooks:
  newPet:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type:
                - string
                - 'null'
      responses:
        '200':
          description: ok
components:
  schemas:
    Pet:
      x-oas-buddy-$schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        kind:
          x-oas-buddy-const: dog
          x-oas-buddy-examples:
            - dog
        id:
          x-oas-buddy-type:
            - integer
            - string
        nothing:
          x-oas-buddy-type:
            - 'null'
        plain:
          type: string
        size:
          type: number
          minimum: 1
          x-oas-buddy-exclusiveMinimum: 0
          maximum: 10
          exclusiveMaximum: true
  x-oas-buddy-pathItems:
    Shared:
      get:
        responses:
          '200':
            description: ok
  securitySchemes:
    ApiKey:
      type: apiKey
      name: X-API-Key
      in: header
  x-oas-buddy-securitySchemes:
    Mutual:
      type: mutualTLS
